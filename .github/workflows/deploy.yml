name: Build and Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAL-Map
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Data Collection Dependencies
        run: npm ci
        working-directory: ./data-collection

      - name: Install Svelte Dependencies
        run: npm ci
        working-directory: ./svelte

      - name: Build Webpack Bundle
        run: npm run build
        working-directory: ./svelte

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: svelte/public
          clean: true
